# Checks the code and builds the Windows installer on every push / pull request.
# A version tag (e.g. v0.2.0) also publishes a GitHub Release with the installer.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the Release on a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Kysland __VERSION__
          releaseBody: See the assets below to download the installer.
          releaseDraft: false

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kysland-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
