<!doctype html>
<!-- The settings window (ui/settings.html) with sample data, for the README screenshots. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kysland — settings</title>
  <link rel="stylesheet" href="../../ui/vendor/lucide.css">
  <link rel="stylesheet" href="../../ui/settings.css">
</head>
<body>
  <header class="hero">
    <div class="home" aria-hidden="true"></div>
    <div class="hero-text">
      <h1>Kysland</h1>
      <p class="version"></p>
    </div>
  </header>
  <main id="sections"></main>
  <div class="toast" role="status"></div>
  <script src="mock.js"></script>
  <script src="../../ui/i18n.js"></script>
  <script src="../../ui/settings.js"></script>
  <script>
    // Kys tab: a little conversation first.
    (async () => {
      const { scene, wait, ready } = window.demo;
      await wait(800);
      if (scene === 'kys') {
        for (const text of ['Nice crown!', 'Are you hungry?']) {
          const input = document.querySelector('.talk input');
          input.value = text;
          input.form.requestSubmit();
          await wait(900);
        }
      }
      await wait(400);
      ready();
    })();
  </script>
</body>
</html>
